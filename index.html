<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hellcastle NFL Pick'em Challenge</title>

  <style>
    :root {
      --navy: #101a35;
      --blue: #3157d5;
      --gold: #f5b942;
      --light: #f5f7fb;
      --border: #dce2ef;
      --green: #dff5e6;
      --red: #ffe1e1;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--light);
      color: #172033;
    }

    header {
      background: var(--navy);
      color: white;
      padding: 24px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 6px;
      font-size: 28px;
    }

    header p {
      margin: 0;
      color: #cbd4f5;
    }

    main {
      max-width: 1400px;
      margin: auto;
      padding: 24px;
    }

    section {
      background: white;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: 0 4px 18px #17203312;
    }

    h2 {
      margin-top: 0;
      color: var(--navy);
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      border-collapse: collapse;
      min-width: 760px;
      width: 100%;
    }

    th,
    td {
      border: 1px solid var(--border);
      padding: 12px;
      text-align: center;
      white-space: nowrap;
    }

    th {
      background: var(--navy);
      color: white;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    th:first-child,
    td:first-child {
      text-align: left;
      position: sticky;
      left: 0;
      background: white;
      z-index: 2;
    }

    th:first-child {
      background: var(--navy);
      z-index: 3;
    }

    .correct {
      background: var(--green);
      font-weight: bold;
    }

    .incorrect {
      background: var(--red);
    }

    .admin-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }

    label {
      font-weight: bold;
      display: block;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      margin-top: 18px;
      background: var(--blue);
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 11px 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #203fae;
    }

    .status {
      margin-top: 12px;
      font-weight: bold;
    }

    .loading {
      color: #68738b;
    }
  </style>
</head>

<body>
  <header>
    <h1>Hellcastle NFL Pick'em Challenge</h1>
    <p>Week 1 • One point per correct pick</p>
  </header>

  <main>
    <section>
      <h2>Pick'em Results</h2>
      <div id="grid" class="loading">Loading picks...</div>
    </section>

    <section>
      <h2>Leaderboard</h2>
      <div id="leaderboard" class="loading">Calculating totals...</div>
    </section>

    <section>
      <h2>Admin Answer Entry</h2>
      <p>Enter the correct answer for each game. For the final game, enter the total points scored by both teams.</p>

      <div id="adminForm" class="admin-grid"></div>

      <button onclick="saveAnswers()">Save Answers</button>
      <div id="adminStatus" class="status"></div>
    </section>
  </main>

  <script>
    const API_URL =
      "https://script.google.com/macros/s/AKfycbwuVgr8Ka-v2XZxEwfLUZ6ng7iVaVavuPLN_tSwfZexdzZapasfipQPCNKLgvDaoJtm/exec";

    let games = [];
    let players = [];
    let picks = {};
    let answers = {};

    async function loadData() {
      try {
        const response = await fetch(API_URL);
        const data = await response.json();

        parseSpreadsheet(data.rows || data);
        renderAdminForm();
        renderGrid();
        renderLeaderboard();
      } catch (error) {
        document.querySelector("#grid").textContent =
          "Unable to load picks. Check that the Apps Script is deployed for anyone with the link.";
        console.error(error);
      }
    }

    function parseSpreadsheet(rows) {
      if (!rows || rows.length < 2) return;

      const headers = rows[0].map(value => String(value).trim());

      // Expected format:
      // Game | Player 1 | Player 2 | Player 3 ...
      players = headers.slice(1).filter(Boolean);

      games = rows.slice(1)
        .filter(row => row[0])
        .map((row, index) => ({
          id: `game-${index}`,
          name: String(row[0]),
          values: row.slice(1).map(value => String(value ?? "").trim())
        }));

      players.forEach((player, playerIndex) => {
        picks[player] = {};

        games.forEach(game => {
          picks[player][game.id] = game.values[playerIndex] || "";
        });
      });
    }

    function renderAdminForm() {
      const form = document.querySelector("#adminForm");

      form.innerHTML = games.map((game, index) => `
        <div>
          <label for="${game.id}">
            ${index + 1}. ${escapeHtml(game.name)}
          </label>
          <input
            id="${game.id}"
            data-game-id="${game.id}"
            placeholder="${index === games.length - 1
              ? "Total points"
              : "Correct answer"}"
            value="${escapeHtml(answers[game.id] || "")}"
          />
        </div>
      `).join("");
    }

    function renderGrid() {
      const container = document.querySelector("#grid");

      const header = `
        <tr>
          <th>Game / Question</th>
          ${players.map(player => `<th>${escapeHtml(player)}</th>`).join("")}
        </tr>
      `;

      const body = games.map(game => `
        <tr>
          <td>${escapeHtml(game.name)}</td>
          ${players.map(player => {
            const answer = picks[player][game.id] || "";
            const correct = answers[game.id] &&
              normalize(answer) === normalize(answers[game.id]);

            return `
              <td class="${answers[game.id]
                ? correct ? "correct" : "incorrect"
                : ""}">
                ${escapeHtml(answer)}
              </td>
            `;
          }).join("")}
        </tr>
      `).join("");

      container.innerHTML = `
        <div class="table-wrap">
          <table>
            <thead>${header}</thead>
            <tbody>${body}</tbody>
          </table>
        </div>
      `;
    }

    function renderLeaderboard() {
      const results = players.map(player => {
        let total = 0;
        let tieBreakerDifference = Number.MAX_SAFE_INTEGER;

        games.forEach((game, index) => {
          const playerAnswer = normalize(picks[player][game.id]);
          const correctAnswer = normalize(answers[game.id]);

          if (correctAnswer && playerAnswer === correctAnswer) {
            total++;
          }

          if (index === games.length - 1 && answers[game.id]) {
            const estimate = Number(picks[player][game.id]);
            const actual = Number(answers[game.id]);

            if (!Number.isNaN(estimate) && !Number.isNaN(actual)) {
              tieBreakerDifference = Math.abs(estimate - actual);
            }
          }
        });

        return {
          player,
          total,
          tieBreakerDifference
        };
      });

      results.sort((a, b) =>
        b.total - a.total ||
        a.tieBreakerDifference - b.tieBreakerDifference
      );

      document.querySelector("#leaderboard").innerHTML = `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Rank</th>
                <th>Player</th>
                <th>Correct Picks</th>
                <th>Tie-Breaker Difference</th>
              </tr>
            </thead>
            <tbody>
              ${results.map((result, index) => `
                <tr>
                  <td>${index + 1}</td>
                  <td>${escapeHtml(result.player)}</td>
                  <td>${result.total}</td>
                  <td>
                    ${result.tieBreakerDifference === Number.MAX_SAFE_INTEGER
                      ? "—"
                      : result.tieBreakerDifference}
                  </td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    async function saveAnswers() {
      const fields = document.querySelectorAll("[data-game-id]");

      const newAnswers = {};
      fields.forEach(field => {
        newAnswers[field.dataset.gameId] = field.value.trim();
      });

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({
            week: "Week1",
            answers: newAnswers
          })
        });

        if (!response.ok) throw new Error("Save failed");

        answers = newAnswers;
        renderGrid();
        renderLeaderboard();

        document.querySelector("#adminStatus").textContent =
          "Answers saved successfully.";
      } catch (error) {
        document.querySelector("#adminStatus").textContent =
          "Unable to save answers. Check the Apps Script doPost function and deployment permissions.";
        console.error(error);
      }
    }

    function normalize(value) {
      return String(value || "").trim().toLowerCase();
    }

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    loadData();
  </script>
</body>
</html>
