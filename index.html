<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hellcastle NFL Pick 'Em</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PapaParse for parsing Google Sheets CSV data -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; }
        .accent-card { background: linear-gradient(145deg, #1e293b, #0f172a); border: 1px solid #334155; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto space-y-6">
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-center bg-slate-800 p-6 rounded-xl border border-slate-700 gap-4">
            <div>
                <h1 class="text-3xl font-extrabold text-amber-500 tracking-wide uppercase">Hellcastle NFL Pick 'Em</h1>
                <p class="text-slate-400 text-sm">22-Week Leaderboard & Weekly Pick Tracking</p>
            </div>
            <div class="flex items-center gap-3">
                <label for="weekSelect" class="text-sm font-semibold text-slate-300">Select Week:</label>
                <select id="weekSelect" onchange="renderApp()" class="bg-slate-900 border border-slate-700 text-amber-400 font-bold px-3 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500">
                    <!-- Populated dynamically up to Week 22 -->
                </select>
            </div>
        </header>

        <!-- Overall Standings -->
        <section class="accent-card p-6 rounded-xl shadow-xl">
            <h2 class="text-xl font-bold text-slate-200 mb-4 flex items-center gap-2">
                <span>🏆</span> Cumulative Season Standings
            </h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-300">
                    <thead class="bg-slate-900/60 text-slate-400 uppercase text-xs">
                        <tr id="leaderboardHead">
                            <th class="py-3 px-4 rounded-l-lg">Rank</th>
                            <th class="py-3 px-4">Player</th>
                            <th class="py-3 px-4 text-center">Selected Week Correct</th>
                            <th class="py-3 px-4 text-right rounded-r-lg">Total Season Score</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboardBody" class="divide-y divide-slate-800">
                        <!-- Populated via JS -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Weekly Breakdown -->
        <section class="accent-card p-6 rounded-xl shadow-xl">
            <h2 id="weeklyTitle" class="text-xl font-bold text-slate-200 mb-4 flex items-center gap-2">
                <span>🏈</span> Pick Details
            </h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-300">
                    <thead class="bg-slate-900/60 text-slate-400 uppercase text-xs" id="weeklyHead">
                        <!-- Populated via JS -->
                    </thead>
                    <tbody id="weeklyBody" class="divide-y divide-slate-800">
                        <!-- Populated via JS -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script>
        // 1. SETTINGS & CONSTANTS
const TOTAL_WEEKS = 22;

// Published Google Sheet CSV URL
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQKVQOWhA9vE55DU0pz53JIE2ViLnW6tuH-vfKJO12IjZXG0r6E6qnEwaPNvQFf0Ir-5cJzT0BfgWg3/pub?output=csv";

// Set weekly winning team outcomes for completed games
const WINNERS = {
    1: {
        "Patriots vs Seahawks": "Seahawks",
        "49ers vs Rams": "49ers",
        "Saints vs Lions": "Lions",
        "Falcons vs Steelers": "Steelers",
        "Ravens vs Colts": "Ravens",
        "Bills vs Texans": "Bills",
        "Bears vs Panthers": "Bears",
        "Browns vs Jaguars": "Jaguars",
        "Jets vs Titans": "Jets",
        "Buccaneers vs Bengals": "Bengals",
        "Cardinals vs Chargers": "Cardinals",
        "Packers vs Vikings": "Vikings",
        "Dolphins vs Raiders": "Raiders",
        "Commanders vs Eagles": "Eagles",
        "Cowboys vs Giants": "Giants",
        "Broncos vs Chiefs": "Chiefs" // Added game without tiebreaker string
    }
};

let rawResponses = [];

// Populate Week dropdown for 22 weeks
const weekSelect = document.getElementById("weekSelect");
for (let i = 1; i <= TOTAL_WEEKS; i++) {
    const opt = document.createElement("option");
    opt.value = i;
    opt.innerText = `Week ${i}`;
    weekSelect.appendChild(opt);
}

// Load data from Google Sheet CSV
function loadSheetData() {
    if (SHEET_CSV_URL.startsWith("http")) {
        Papa.parse(SHEET_CSV_URL, {
            download: true,
            header: true,
            complete: function(results) {
                parseFormResponses(results.data);
                renderApp();
            }
        });
    } else {
        renderApp();
    }
}

function parseFormResponses(data) {
    const playerMap = {};

    data.forEach(row => {
        const name = row["What is your name?"] || "Anonymous";
        const weekStr = row["Which week are you submitting for?"] || "Week 1";
        const weekNum = parseInt(weekStr.replace(/\D/g, "")) || 1;

        const weekPicks = {};
        for (const key in row) {
            if (key.includes("vs")) {
                // Remove tiebreakers and trailing question marks so keys match WINNERS object
                const cleanKey = key.split(" - ")[0].replace(/[?]/g, "").trim();
                weekPicks[cleanKey] = row[key];
            }
        }

        if (!playerMap[name]) {
            playerMap[name] = { name: name, picks: {} };
        }
        
        playerMap[name].picks[weekNum] = weekPicks;
    });

    rawResponses = Object.values(playerMap);
}

function calculateWeekScore(playerPicks, week) {
    const weekWinners = WINNERS[week] || {};
    let score = 0;
    for (const game in weekWinners) {
        if (weekWinners[game] && playerPicks && playerPicks[game] === weekWinners[game]) {
            score++;
        }
    }
    return score;
}

function renderApp() {
    const selectedWeek = parseInt(document.getElementById("weekSelect").value);
    document.getElementById("weeklyTitle").innerText = `🏈 Week ${selectedWeek} Pick Details`;

    const playerStats = rawResponses.map(player => {
        let cumulativeScore = 0;
        const weekScores = {};

        for (let w = 1; w <= TOTAL_WEEKS; w++) {
            const wScore = calculateWeekScore(player.picks ? player.picks[w] : {}, w);
            weekScores[w] = wScore;
            cumulativeScore += wScore;
        }

        return {
            name: player.name,
            selectedWeekScore: weekScores[selectedWeek] || 0,
            total: cumulativeScore,
            picks: (player.picks && player.picks[selectedWeek]) || {}
        };
    });

    playerStats.sort((a, b) => b.total - a.total);

    // Render Cumulative Standings
    const leaderboardBody = document.getElementById("leaderboardBody");
    leaderboardBody.innerHTML = playerStats.map((p, idx) => `
        <tr class="hover:bg-slate-800/50 transition">
            <td class="py-3 px-4 font-bold text-amber-500">#${idx + 1}</td>
            <td class="py-3 px-4 font-semibold text-white">${p.name}</td>
            <td class="py-3 px-4 text-center">${p.selectedWeekScore}</td>
            <td class="py-3 px-4 text-right font-extrabold text-amber-400">${p.total} pts</td>
        </tr>
    `).join("");

    // Derive all game matchups present in responses or completed winners
    const weekWinners = WINNERS[selectedWeek] || {};
    const allMatchesInPicks = playerStats.length > 0 ? Object.keys(playerStats[0].picks) : [];
    const weekGames = Array.from(new Set([...Object.keys(weekWinners), ...allMatchesInPicks]));

    const weeklyHead = document.getElementById("weeklyHead");
    if (weekGames.length === 0) {
        weeklyHead.innerHTML = `<tr><th class="py-3 px-4">No matchup data entered yet for Week ${selectedWeek}.</th></tr>`;
        document.getElementById("weeklyBody").innerHTML = "";
        return;
    }

    weeklyHead.innerHTML = `
        <tr>
            <th class="py-3 px-4 rounded-l-lg">Player</th>
            ${weekGames.map(g => {
                const winner = weekWinners[g];
                const winnerLabel = winner ? `Winner: ${winner}` : "Pending";
                return `<th class="py-3 px-4 text-center">${g}<br><span class="text-xs text-amber-500 font-normal">(${winnerLabel})</span></th>`;
            }).join("")}
            <th class="py-3 px-4 text-right rounded-r-lg">Week ${selectedWeek} Score</th>
        </tr>
    `;

    // Render Weekly Table Rows
    const weeklyBody = document.getElementById("weeklyBody");
    weeklyBody.innerHTML = playerStats.map(p => {
        const gameCells = weekGames.map(game => {
            const pick = p.picks[game] || "-";
            const winner = weekWinners[game];
            let badgeColor = "";

            if (!winner) {
                badgeColor = "bg-slate-800 text-slate-400 border border-slate-700";
            } else if (pick === winner) {
                badgeColor = "bg-emerald-900/60 text-emerald-400 border border-emerald-700";
            } else {
                badgeColor = "bg-rose-900/60 text-rose-400 border border-rose-700";
            }
            return `<td class="py-3 px-4 text-center"><span class="px-2 py-1 rounded text-xs font-bold ${badgeColor}">${pick}</span></td>`;
        }).join("");

        return `
            <tr class="hover:bg-slate-800/50 transition">
                <td class="py-3 px-4 font-semibold text-white">${p.name}</td>
                ${gameCells}
                <td class="py-3 px-4 text-right font-bold text-slate-200">${p.selectedWeekScore} / ${Object.keys(weekWinners).length}</td>
            </tr>
        `;
    }).join("");
}

loadSheetData();
    </script>
</body>
</html>
